# The datasource is handed over by OfflinePgResource at run time: its url names the port the
# embedded postgres was given, which cannot be written into a file.

# A @QuarkusTest starts the HTTP server on a fixed port by default, and 8081 is the npm registry on
# this platform's development hosts.
quarkus.http.test-port=0

# No container may be started behind the suite's back: the rig is zonky's postgres.
quarkus.devservices.enabled=false
