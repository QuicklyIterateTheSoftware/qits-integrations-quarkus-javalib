# Defaults for qits-telemetry-core (epic qits-428). Shipped as microprofile-config.properties so a
# consuming application's application.properties (250) and env (300) override them (this file: 100).
#
# The receiver at its public edge host, like every other peer: qits-observability's OTLP/HTTP ingest
# (OtelReceiverResource, POST /observability/api/otel/v1/{traces,logs,metrics}, application/x-protobuf).
# The /v1/<signal> suffix is appended by the exporters, so this is the base, spelled exactly as
# quarkus.otel.exporter.otlp.endpoint used to be. NO DEFAULT FOR QITS_DOMAIN, the estate's rule
# (qits-1402); it is read only when the OpenTelemetry SDK builds the exporters, so a %test profile
# with the SDK disabled never needs it.
qits.telemetry.endpoint=https://observability.qits.${QITS_DOMAIN}/observability/api/otel

# The bearer: the named oidc client's token, on every export request. false is the opt-out
# (qits-observability on localhost, qits-edge per E1): no Authorization header, no oidc client.
qits.telemetry.bearer.enabled=true
qits.telemetry.bearer.client=qits
# The longest one export waits for a token that is not cached yet. A cached token answers at once.
qits.telemetry.bearer.timeout=5S

# The export request's own timeout, and its body encoding (none | gzip; the receiver takes both).
qits.telemetry.timeout=10S
qits.telemetry.compression=none
