# The SDK ON in %test, unlike every service: these suites are about what it exports.
quarkus.otel.sdk.disabled=false
quarkus.otel.traces.exporter=cdi
quarkus.otel.logs.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.metrics.enabled=true
quarkus.otel.metrics.exporter=cdi

# Export fast, so a test waits on the stub for milliseconds rather than the 5s/1m defaults.
quarkus.otel.bsp.schedule.delay=100ms
quarkus.otel.blrp.schedule.delay=100ms
quarkus.otel.metric.export.interval=500ms

# The unnamed default oidc client has no server here; only the named `qits` one (StubPlatform) does.
quarkus.oidc-client.client-enabled=false
# No Keycloak dev service: StubPlatform is the idp, and there is no docker here.
quarkus.keycloak.devservices.enabled=false

# StubPlatform supplies qits.telemetry.endpoint and the `qits` client's settings at boot.
